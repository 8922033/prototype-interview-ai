<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>Prototype Interview AI</title>

<style>
body { margin:0; font-family:Arial; background:#f4f6f8; }

.wrapper { display:flex; height:100vh; }

.left {
    width:320px;
    background:white;
    padding:15px;
    border-right:1px solid #ddd;
    overflow:auto;
}

.right {
    flex:1;
    display:flex;
    flex-direction:column;
}

.chat {
    flex:1;
    padding:10px;
    overflow:auto;
}

.input-area {
    display:flex;
    border-top:1px solid #ddd;
}

.msg {
    margin:8px;
    padding:10px;
    border-radius:8px;
    max-width:70%;
}

.user { background:#dbeafe; margin-left:auto; }
.ai { background:#e5e7eb; }

button { width:100%; padding:10px; }
input, textarea, select { width:100%; margin:6px 0; }
</style>

</head>

<body>

<div class="wrapper">

<!-- 左 -->
<div class="left">

<h3>設定</h3>

<input type="file" id="image" multiple>

<input type="text" id="url" placeholder="URL">

<textarea id="questions" placeholder="質問（1行ずつ）"></textarea>

<select id="personality">
<option value="active">積極的</option>
<option value="passive">受け身</option>
</select>

<button onclick="start()">開始</button>

</div>

<!-- 右 -->
<div class="right">

<div class="chat" id="chat"></div>

<div class="input-area">
<input id="input">
<button onclick="send()">送信</button>
</div>

</div>

</div>

<script>

let history = [];
let images = [];

document.getElementById("image").addEventListener("change", function(e){

    images = [];

    Array.from(e.target.files).forEach(file => {

        const reader = new FileReader();

        reader.onload = function(evt) {

            images.push({
                data: evt.target.result.split(",")[1],
                mime_type: file.type
            });

        };

        reader.readAsDataURL(file);

    });

});

function add(text, type){
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

async function start() {

    // チャットをリセット
    document.getElementById("chat").innerHTML = "";

    // 履歴をリセット
    history = [];

    const res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({

            personality: document.getElementById("personality").value,

            prototype_url: document.getElementById("url").value,

            questions: document.getElementById("questions")
                .value
                .split("\n")
                .filter(q => q.trim() !== ""),

            prototype_images: images,

            history: [
                {
                    role: "user",
                    content:
                        "インタビューを開始してください。まずあなたから簡単に挨拶をして、その後すぐに最初の質問をしてください。"
                }
            ]

        })
    });

    const data = await res.json();

    if (!data.success) {
        alert(data.message);
        return;
    }
     
// 開始指示も履歴に保存
    history.push({
    role: "user",
    content:
        "インタビューを開始してください。まずあなたから簡単に挨拶をして、その後すぐに最初の質問をしてください。"
});

 // AIの最初の発言を表示
    add(data.message, "ai");

    // 履歴に保存
    history.push({
        role: "assistant",
        content: data.message
    });

}

async function send(){

    const text = document.getElementById("input").value;
    if(!text) return;

    add(text, "user");

    history.push({
        role:"user",
        content:text
    });

    const res = await fetch("/chat", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            personality: document.getElementById("personality").value,
            prototype_url: document.getElementById("url").value,
            questions: document.getElementById("questions")
                .value.split("\n")
                .filter(q => q.trim() !== ""),
            prototype_images: images,
            history
        })
    });

    const data = await res.json();

    add(data.message, "ai");

    history.push({
        role:"assistant",
        content:data.message
    });

    document.getElementById("input").value = "";
}

</script>

</body>
</html>
