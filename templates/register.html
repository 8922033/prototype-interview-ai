<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>ユーザー登録</title>

</head>

<body>

<h2>新規登録</h2>

<form method="POST">

<label>ユーザー名</label>

<input
type="text"
name="username"
required>

<br><br>

<label>メールアドレス</label>

<input
type="email"
name="email"
required>

<br><br>

<label>パスワード</label>

<input
type="password"
name="password"
required>

<br><br>

<button type="submit">

登録

</button>

</form>

<br>

<a href="/login">

ログインはこちら

</a>

</body>

</html>
